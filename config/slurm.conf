# slurm.conf -- Hummel-2 emulation on top of slurm-docker (single container).
#
# Mirrors the *policy* of the Hummel-2 production cluster (Slurm 24.11.4, as
# observed on the login nodes): partitions std/big/gpu/gputest, per-CPU memory
# defaults, accounting with association enforcement, a submit filter.  It does
# NOT mirror hardware: three small slurmd instances on one host stand in for the
# 190 real nodes.  See README.md ("Known differences").
#
ClusterName=hummel
# slurm-docker's entrypoint rewrites this line with the container hostname.
SlurmctldHost=slurmctl

ProctrackType=proctrack/linuxproc
ReturnToService=1
SlurmdParameters=config_overrides
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurm/slurmd-%n.pid
SlurmdSpoolDir=/var/spool/slurm/%n
SlurmUser=slurm
StateSaveLocation=/var/lib/slurm
TaskPlugin=task/affinity

# TIMERS (KillWait, MinJobAge as on Hummel)
GetEnvTimeout=2
InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0
MaxArraySize=1001

# SCHEDULING
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
EnforcePartLimits=ANY
GresTypes=gpu

# SITE HOOKS
JobSubmitPlugins=lua
Prolog=/etc/slurm/prolog.sh
Epilog=/etc/slurm/epilog.sh

# LOGGING AND ACCOUNTING (association enforcement as on Hummel)
AccountingStorageHost=localhost
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageEnforce=associations,limits
AccountingStoreFlags=job_script,job_env
JobCompLoc=/var/log/slurm/jobcomp.log
JobCompType=jobcomp/filetxt
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd-%n.log

# AUTHENTICATION
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

# COMPUTE NODES
# slurm-docker's entrypoint starts exactly node1..node3, so the Hummel
# partitions are mapped onto those three (partitions may share nodes).
NodeName=node1 NodeAddr=127.0.0.1 Port=7001 CPUs=8 RealMemory=96000 State=UNKNOWN
NodeName=node2 NodeAddr=127.0.0.1 Port=7002 CPUs=8 RealMemory=96000 State=UNKNOWN
NodeName=node3 NodeAddr=127.0.0.1 Port=7003 CPUs=8 RealMemory=144000 Gres=gpu:h100:2 State=UNKNOWN

# PARTITIONS (values from `scontrol show partition` on Hummel-2)
PartitionName=std     Nodes=node[1-2] Default=YES DefaultTime=01:00:00 MaxTime=INFINITE DefMemPerCPU=4000  MaxMemPerCPU=4000  PriorityTier=1000 PriorityJobFactor=1000 DisableRootJobs=YES State=UP
PartitionName=big     Nodes=node2     DefaultTime=01:00:00 MaxTime=INFINITE DefMemPerCPU=12064 MaxMemPerCPU=12064 PriorityTier=2000 PriorityJobFactor=2000 OverSubscribe=EXCLUSIVE DisableRootJobs=YES State=UP
PartitionName=gpu     Nodes=node3     DefaultTime=01:00:00 MaxTime=INFINITE DefMemPerCPU=18000 MaxMemPerCPU=18000 PriorityTier=2000 PriorityJobFactor=2000 DisableRootJobs=YES State=UP
PartitionName=gputest Nodes=node1     DefaultTime=00:10:00 MaxTime=INFINITE DefMemPerCPU=12000 MaxMemPerCPU=12000 MaxCPUsPerNode=8 PriorityTier=1000 PriorityJobFactor=1000 DisableRootJobs=YES State=UP
